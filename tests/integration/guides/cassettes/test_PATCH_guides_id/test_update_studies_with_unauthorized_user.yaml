        [\n          {\n            \"text\": \"[{\\\"day\\\":1,\\\"title\\\":\\\"Fundamentos
        da Conteineriza\xE7\xE3o\\\",\\\"Meta do Dia\\\":\\\"Entender o conceito de
        cont\xEAineres e sua diferen\xE7a para m\xE1quinas virtuais.\\\",\\\"O Qu\xEA
        Pesquisar (Teoria)\\\":[\\\"O que \xE9 isolamento em n\xEDvel de sistema operacional?\\\",\\\"Comparativo:
        Hypervisor vs Docker Engine.\\\"],\\\"M\xE3o na Massa (Pr\xE1tica)\\\":\\\"Desenhar
        um diagrama que ilustre as camadas de infraestrutura de uma VM comparada a
        um cont\xEAiner Docker.\\\",\\\"Verifica\xE7\xE3o de Aprendizado\\\":\\\"Qual
        a principal vantagem da arquitetura de cont\xEAineres em rela\xE7\xE3o ao
        consumo de recursos?\\\"},{\\\"day\\\":2,\\\"title\\\":\\\"Hist\xF3ria e Arquitetura
        do Docker\\\",\\\"Meta do Dia\\\":\\\"Compreender o ecossistema Docker e os
        componentes principais.\\\",\\\"O Qu\xEA Pesquisar (Teoria)\\\":[\\\"O que
