        Avan\xE7ada\\\",\\\"Meta do Dia\\\":\\\"Entrar em cont\xEAineres em execu\xE7\xE3o
        para fins de debulha (debug).\\\",\\\"O Qu\xEA Pesquisar (Teoria)\\\":[\\\"Diferen\xE7a
        entre 'docker attach' e 'docker exec'.\\\",\\\"Uso de comandos de inspe\xE7\xE3o
        'docker inspect'.\\\"],\\\"M\xE3o na Massa (Pr\xE1tica)\\\":\\\"Executar o
