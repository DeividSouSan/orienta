        conceito de Docker Host e Registry.\\\"],\\\"M\xE3o na Massa (Pr\xE1tica)\\\":\\\"Fazer
        um mapa mental conectando o cliente, o host e o registro (Docker Hub).\\\",\\\"Verifica\xE7\xE3o
        de Aprendizado\\\":\\\"Qual o componente do Docker \xE9 respons\xE1vel por
        receber e processar os comandos via CLI?\\\"},{\\\"day\\\":3,\\\"title\\\":\\\"Instala\xE7\xE3o
        e Primeiros Passos\\\",\\\"Meta do Dia\\\":\\\"Preparar o ambiente e validar
        a instala\xE7\xE3o b\xE1sica.\\\",\\\"O Qu\xEA Pesquisar (Teoria)\\\":[\\\"Requisitos
        do sistema para rodar Docker Desktop vs Docker Engine.\\\",\\\"Comandos 'docker
        version' e 'docker info'.\\\"],\\\"M\xE3o na Massa (Pr\xE1tica)\\\":\\\"Instalar
        o Docker e executar o comando 'docker run hello-world' para verificar se o
        ambiente est\xE1 funcional.\\\",\\\"Verifica\xE7\xE3o de Aprendizado\\\":\\\"O
        que acontece tecnicamente quando o Docker n\xE3o encontra a imagem 'hello-world'
        localmente?\\\"},{\\\"day\\\":4,\\\"title\\\":\\\"Ciclo de Vida de Imagens\\\",\\\"Meta
        do Dia\\\":\\\"Aprender a buscar e baixar imagens oficiais.\\\",\\\"O Qu\xEA
        Pesquisar (Teoria)\\\":[\\\"O que s\xE3o Tags de imagens Docker?\\\",\\\"Funcionamento
        do comando 'docker pull'.\\\",\\\"Explorar o portal Docker Hub.\\\"],\\\"M\xE3o
        na Massa (Pr\xE1tica)\\\":\\\"Buscar a imagem oficial do Ubuntu no Docker
        Hub, baix\xE1-la com 'pull' e listar todas as imagens locais.\\\",\\\"Verifica\xE7\xE3o
        de Aprendizado\\\":\\\"Como o Docker diferencia duas vers\xF5es da mesma imagem
        localmente?\\\"},{\\\"day\\\":5,\\\"title\\\":\\\"Manipulando Cont\xEAineres:
        Cria\xE7\xE3o\\\",\\\"Meta do Dia\\\":\\\"Executar cont\xEAineres em diferentes
        estados.\\\",\\\"O Qu\xEA Pesquisar (Teoria)\\\":[\\\"Comando 'docker run'
        e suas varia\xE7\xF5es.\\\",\\\"O que significa rodar em modo 'interativo'
        (-it) vs modo 'daemon' (-d).\\\"],\\\"M\xE3o na Massa (Pr\xE1tica)\\\":\\\"Iniciar
        um cont\xEAiner Ubuntu no modo interativo, explorar o sistema de arquivos
        interno e sair.\\\",\\\"Verifica\xE7\xE3o de Aprendizado\\\":\\\"O que acontece
        com um cont\xEAiner quando sa\xEDmos do seu processo principal (shell) no
        modo interativo?\\\"},{\\\"day\\\":6,\\\"title\\\":\\\"Gest\xE3o de Estados
        de Cont\xEAineres\\\",\\\"Meta do Dia\\\":\\\"Aprender comandos para pausar,
        parar e retomar cont\xEAineres.\\\",\\\"O Qu\xEA Pesquisar (Teoria)\\\":[\\\"Diferen\xE7a
        entre 'docker stop' e 'docker kill'.\\\",\\\"Utilidade dos comandos 'docker
        pause' e 'docker unpause'.\\\"],\\\"M\xE3o na Massa (Pr\xE1tica)\\\":\\\"Executar
        um cont\xEAiner nginx em segundo plano, paus\xE1-lo, despaus\xE1-lo, par\xE1-lo
        e inici\xE1-lo novamente.\\\",\\\"Verifica\xE7\xE3o de Aprendizado\\\":\\\"Qual
        o comando utilizado para visualizar cont\xEAineres que foram parados, mas
        n\xE3o exclu\xEDdos?\\\"},{\\\"day\\\":7,\\\"title\\\":\\\"Monitoramento e
        Logs\\\",\\\"Meta do Dia\\\":\\\"Obter informa\xE7\xF5es em tempo real sobre
        cont\xEAineres em execu\xE7\xE3o.\\\",\\\"O Qu\xEA Pesquisar (Teoria)\\\":[\\\"Uso
        do 'docker logs' com a flag '-f' (follow).\\\",\\\"Comando 'docker top' e
        'docker stats'.\\\"],\\\"M\xE3o na Massa (Pr\xE1tica)\\\":\\\"Rodar um servidor
        web e monitorar os logs de acesso conforme interage com ele, observando tamb\xE9m
        o consumo de mem\xF3ria.\\\",\\\"Verifica\xE7\xE3o de Aprendizado\\\":\\\"Como
        visualizar as estat\xEDsticas de consumo de recursos de todos os cont\xEAineres
        em execu\xE7\xE3o de uma s\xF3 vez?\\\"},{\\\"day\\\":8,\\\"title\\\":\\\"Limpeza
        de Ambiente e Manuten\xE7\xE3o\\\",\\\"Meta do Dia\\\":\\\"Remover recursos
        in\xFAteis e economizar espa\xE7o em disco.\\\",\\\"O Qu\xEA Pesquisar (Teoria)\\\":[\\\"Remo\xE7\xE3o
        de cont\xEAineres (rm) e imagens (rmi).\\\",\\\"O comando 'docker system prune'.\\\"],\\\"M\xE3o
        na Massa (Pr\xE1tica)\\\":\\\"Identificar cont\xEAineres parados e imagens
        sem tag e realizar a exclus\xE3o segura para liberar espa\xE7o no host.\\\",\\\"Verifica\xE7\xE3o
        de Aprendizado\\\":\\\"Qual o perigo de utilizar o comando 'docker system
        prune -a' sem cautela?\\\"},{\\\"day\\\":9,\\\"title\\\":\\\"Persist\xEAncia
        de Dados: Volumes\\\",\\\"Meta do Dia\\\":\\\"Entender como o Docker lida
        com a volatilidade dos dados.\\\",\\\"O Qu\xEA Pesquisar (Teoria)\\\":[\\\"Diferen\xE7a
        entre Volumes gerenciados e Bind Mounts.\\\",\\\"O sistema de arquivos 'Copy-on-Write'.\\\"],\\\"M\xE3o
        na Massa (Pr\xE1tica)\\\":\\\"Criar um volume nomeado e associ\xE1-lo a um
        cont\xEAiner, salvar um arquivo e verificar a persist\xEAncia ap\xF3s deletar
        o cont\xEAiner.\\\",\\\"Verifica\xE7\xE3o de Aprendizado\\\":\\\"Por que os
        dados gravados dentro da camada do cont\xEAiner s\xE3o perdidos ao exclu\xED-lo?\\\"},{\\\"day\\\":10,\\\"title\\\":\\\"Redes
        Docker: Conceitos B\xE1sicos\\\",\\\"Meta do Dia\\\":\\\"Conectar cont\xEAineres
        \xE0 rede e ao host.\\\",\\\"O Qu\xEA Pesquisar (Teoria)\\\":[\\\"Driver de
        rede 'bridge' vs 'host'.\\\",\\\"Exposi\xE7\xE3o de portas e o comando '-p'
        (port publish).\\\"],\\\"M\xE3o na Massa (Pr\xE1tica)\\\":\\\"Subir um servidor
        Apache (httpd) mapeando a porta 8080 do host para a porta 80 do cont\xEAiner
        e acess\xE1-lo via navegador.\\\",\\\"Verifica\xE7\xE3o de Aprendizado\\\":\\\"Como
        funciona o mapeamento de portas entre a m\xE1quina f\xEDsica e o Docker?\\\"},{\\\"day\\\":11,\\\"title\\\":\\\"Cria\xE7\xE3o
        de Imagens Customizadas: Dockerfile\\\",\\\"Meta do Dia\\\":\\\"Aprender a
        automa\xE7\xE3o de build com Dockerfile.\\\",\\\"O Qu\xEA Pesquisar (Teoria)\\\":[\\\"Sintaxe
        b\xE1sica do Dockerfile.\\\",\\\"As instru\xE7\xF5es FROM, RUN e CMD.\\\"],\\\"M\xE3o
        na Massa (Pr\xE1tica)\\\":\\\"Criar um Dockerfile que utilize uma imagem base
        do Alpine Linux, instale o pacote 'curl' e defina o comando padr\xE3o.\\\",\\\"Verifica\xE7\xE3o
        de Aprendizado\\\":\\\"Qual a fun\xE7\xE3o da instru\xE7\xE3o 'FROM' em um
        Dockerfile?\\\"},{\\\"day\\\":12,\\\"title\\\":\\\"Instru\xE7\xF5es Avan\xE7adas
        de Dockerfile\\\",\\\"Meta do Dia\\\":\\\"Otimizar a estrutura do build de
        imagens.\\\",\\\"O Qu\xEA Pesquisar (Teoria)\\\":[\\\"Uso de COPY vs ADD.\\\",\\\"A
        import\xE2ncia da instru\xE7\xE3o WORKDIR.\\\",\\\"O arquivo .dockerignore.\\\"],\\\"M\xE3o
        na Massa (Pr\xE1tica)\\\":\\\"Criar um script Python simples, usar COPY para
        coloc\xE1-lo dentro de uma imagem e configur\xE1-la para rodar automaticamente
        no boot.\\\",\\\"Verifica\xE7\xE3o de Aprendizado\\\":\\\"Por que o uso de
        'WORKDIR' \xE9 prefer\xEDvel ao uso repetido de comandos 'cd' em instru\xE7\xF5es
        RUN?\\\"},{\\\"day\\\":13,\\\"title\\\":\\\"Gest\xE3o de Comandos de Build\\\",\\\"Meta
        do Dia\\\":\\\"Comandar a constru\xE7\xE3o e o versionamento de imagens.\\\",\\\"O
        Qu\xEA Pesquisar (Teoria)\\\":[\\\"Comando 'docker build' e a flag '-t' (tagging).\\\",\\\"Conceito
        de Build Cache e como ele acelera processos.\\\"],\\\"M\xE3o na Massa (Pr\xE1tica)\\\":\\\"Construir
        tr\xEAs vers\xF5es de uma imagem alterando pequenas partes do c\xF3digo para
