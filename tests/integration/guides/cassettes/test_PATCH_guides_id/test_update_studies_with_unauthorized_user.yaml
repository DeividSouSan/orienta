        limitando seu uso a 512MB de RAM e testar se ele consegue ultrapassar esse
        limite com um teste de estresse.\\\",\\\"Verifica\xE7\xE3o de Aprendizado\\\":\\\"O
        que ocorre com um cont\xEAiner se ele atinge o limite severo (hard limit)
        de mem\xF3ria definido?\\\"},{\\\"day\\\":18,\\\"title\\\":\\\"Docker Registry:
        Enviando Imagens\\\",\\\"Meta do Dia\\\":\\\"Compartilhar suas cria\xE7\xF5es
