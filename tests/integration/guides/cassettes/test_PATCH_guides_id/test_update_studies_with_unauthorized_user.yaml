      string: "{\n  \"candidates\": [\n    {\n      \"content\": {\n        \"parts\":
        [\n          {\n            \"text\": \"[\\n    {\\n        \\\"day\\\": 1,\\n
        \       \\\"title\\\": \\\"Introdu\xE7\xE3o ao Docker\\\",\\n        \\\"Meta
        do Dia\\\": \\\"Compreender o que \xE9 o Docker, seus benef\xEDcios e o conceito
        de cont\xEAineres.\\\",\\n        \\\"O Qu\xEA Pesquisar (Teoria)\\\": [\\n
        \           \\\"O que \xE9 Docker?\\\",\\n            \\\"Para que serve o
        Docker?\\\",\\n            \\\"Diferen\xE7a entre cont\xEAineres e m\xE1quinas
        virtuais\\\"\\n        ],\\n        \\\"M\xE3o na Massa (Pr\xE1tica)\\\":
        \\\"Instalar o Docker Desktop no seu sistema operacional e verificar a instala\xE7\xE3o
        executando `docker --version`.\\\",\\n        \\\"Verifica\xE7\xE3o de Aprendizado\\\":
        \\\"Em suas pr\xF3prias palavras, qual a principal vantagem de usar Docker
        em compara\xE7\xE3o com m\xE1quinas virtuais tradicionais?\\\"\\n    },\\n
        \   {\\n        \\\"day\\\": 2,\\n        \\\"title\\\": \\\"Conceitos Fundamentais:
        Imagens e Cont\xEAineres\\\",\\n        \\\"Meta do Dia\\\": \\\"Entender
        a rela\xE7\xE3o entre imagens Docker e cont\xEAineres em execu\xE7\xE3o.\\\",\\n
        \       \\\"O Qu\xEA Pesquisar (Teoria)\\\": [\\n            \\\"O que \xE9
        uma imagem Docker?\\\",\\n            \\\"O que \xE9 um cont\xEAiner Docker?\\\",\\n
        \           \\\"Como uma imagem se torna um cont\xEAiner?\\\"\\n        ],\\n
        \       \\\"M\xE3o na Massa (Pr\xE1tica)\\\": \\\"Pesquisar como rodar um
        cont\xEAiner simples a partir de uma imagem existente (ex: `docker run hello-world`)
        e observar a sa\xEDda.\\\",\\n        \\\"Verifica\xE7\xE3o de Aprendizado\\\":
        \\\"Qual a diferen\xE7a fundamental entre uma imagem e um cont\xEAiner Docker?\\\"\\n
        \   },\\n    {\\n        \\\"day\\\": 3,\\n        \\\"title\\\": \\\"Primeiros
        Comandos: `docker run`\\\",\\n        \\\"Meta do Dia\\\": \\\"Dominar o comando
        `docker run` para criar e iniciar cont\xEAineres.\\\",\\n        \\\"O Qu\xEA
        Pesquisar (Teoria)\\\": [\\n            \\\"Op\xE7\xF5es comuns do comando
        `docker run` (ex: `-d`, `-p`, `--name`)\\\",\\n            \\\"O que significa
        o modo 'detached' (`-d`)?\\\",\\n            \\\"Como expor portas de um cont\xEAiner
        (`-p`)?\\\"\\n        ],\\n        \\\"M\xE3o na Massa (Pr\xE1tica)\\\": \\\"Criar
        e rodar um cont\xEAiner de um servidor web simples (como Nginx ou Apache)
        em background (`-d`) e mapear a porta local para a porta do cont\xEAiner (`-p`).\\\",\\n
        \       \\\"Verifica\xE7\xE3o de Aprendizado\\\": \\\"Quais as principais
        diferen\xE7as entre rodar um cont\xEAiner em foreground e em background (`-d`)?\\\"\\n
        \   },\\n    {\\n        \\\"day\\\": 4,\\n        \\\"title\\\": \\\"Gerenciamento
        de Cont\xEAineres: `ps`, `stop`, `rm`\\\",\\n        \\\"Meta do Dia\\\":
        \\\"Aprender a listar, parar e remover cont\xEAineres Docker.\\\",\\n        \\\"O
        Qu\xEA Pesquisar (Teoria)\\\": [\\n            \\\"Comando `docker ps` (listar
        cont\xEAineres)\\\",\\n            \\\"Comando `docker stop`\\\",\\n            \\\"Comando
        `docker rm`\\\"\\n        ],\\n        \\\"M\xE3o na Massa (Pr\xE1tica)\\\":
        \\\"Listar todos os cont\xEAineres (incluindo os parados), parar o cont\xEAiner
        web criado anteriormente e depois remov\xEA-lo.\\\",\\n        \\\"Verifica\xE7\xE3o
        de Aprendizado\\\": \\\"Como voc\xEA verifica se um cont\xEAiner est\xE1 em
        execu\xE7\xE3o e como voc\xEA o para?\\\"\\n    },\\n    {\\n        \\\"day\\\":
        5,\\n        \\\"title\\\": \\\"Gerenciamento de Imagens: `pull`, `images`,
        `rmi`\\\",\\n        \\\"Meta do Dia\\\": \\\"Entender como buscar, listar
        e remover imagens Docker.\\\",\\n        \\\"O Qu\xEA Pesquisar (Teoria)\\\":
        [\\n            \\\"Comando `docker pull` (baixar imagens)\\\",\\n            \\\"Comando
        `docker images` (listar imagens locais)\\\",\\n            \\\"Comando `docker
        rmi` (remover imagens)\\\"\\n        ],\\n        \\\"M\xE3o na Massa (Pr\xE1tica)\\\":
        \\\"Baixar uma nova imagem (ex: `ubuntu`), listar as imagens dispon\xEDveis
        e depois remover a imagem baixada.\\\",\\n        \\\"Verifica\xE7\xE3o de
        Aprendizado\\\": \\\"Qual a diferen\xE7a entre `docker ps` e `docker images`?\\\"\\n
        \   },\\n    {\\n        \\\"day\\\": 6,\\n        \\\"title\\\": \\\"Construindo
        suas Pr\xF3prias Imagens: Dockerfile\\\",\\n        \\\"Meta do Dia\\\": \\\"Compreender
        a estrutura b\xE1sica de um Dockerfile e como ele \xE9 usado para criar imagens
        customizadas.\\\",\\n        \\\"O Qu\xEA Pesquisar (Teoria)\\\": [\\n            \\\"O
        que \xE9 um Dockerfile?\\\",\\n            \\\"Comandos b\xE1sicos de um Dockerfile:
        `FROM`, `RUN`, `COPY`, `CMD`, `EXPOSE`\\\",\\n            \\\"Qual o prop\xF3sito
        de cada comando no Dockerfile?\\\"\\n        ],\\n        \\\"M\xE3o na Massa
        (Pr\xE1tica)\\\": \\\"Criar um Dockerfile simples para uma aplica\xE7\xE3o
        b\xE1sica (ex: um script Python que imprime uma mensagem) e construir a imagem
        com `docker build`.\\\",\\n        \\\"Verifica\xE7\xE3o de Aprendizado\\\":
        \\\"Para que servem os comandos `FROM` e `CMD` dentro de um Dockerfile?\\\"\\n
        \   },\\n    {\\n        \\\"day\\\": 7,\\n        \\\"title\\\": \\\"Criando
        e Rodando um Aplicativo Customizado\\\",\\n        \\\"Meta do Dia\\\": \\\"Praticar
        a constru\xE7\xE3o e execu\xE7\xE3o de cont\xEAineres a partir de um Dockerfile
        que voc\xEA criou.\\\",\\n        \\\"O Qu\xEA Pesquisar (Teoria)\\\": [\\n
        \           \\\"Melhores pr\xE1ticas para Dockerfiles.\\\",\\n            \\\"Como
        usar `COPY` vs `ADD` no Dockerfile.\\\",\\n            \\\"Entendendo o contexto
        de build do Docker.\\\"\\n        ],\\n        \\\"M\xE3o na Massa (Pr\xE1tica)\\\":
        \\\"Expandir o Dockerfile do dia anterior para incluir um script Python mais
        complexo ou uma p\xE1gina HTML est\xE1tica e rodar o cont\xEAiner resultante.\\\",\\n
