        Local com Compose\\\",\\\"Meta do Dia\\\":\\\"Subir m\xFAltiplos servi\xE7os
        interligados com um \xFAnico comando.\\\",\\\"O Qu\xEA Pesquisar (Teoria)\\\":[\\\"Comandos
        'docker-compose up', 'down' e 'stop'.\\\",\\\"Defini\xE7\xE3o de 'services'
