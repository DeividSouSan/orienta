        flag '--env' ou '-e' no comando run.\\\",\\\"Carregamento de vari\xE1veis
        atrav\xE9s de arquivos .env.\\\"],\\\"M\xE3o na Massa (Pr\xE1tica)\\\":\\\"Configurar
        as credenciais (usu\xE1rio e senha) de uma imagem Postgres usando vari\xE1veis
        de ambiente na inicializa\xE7\xE3o.\\\",\\\"Verifica\xE7\xE3o de Aprendizado\\\":\\\"Como
        o uso de vari\xE1veis de ambiente aumenta a portabilidade de um cont\xEAiner?\\\"},{\\\"day\\\":17,\\\"title\\\":\\\"Limitando
        Recursos de Hardware\\\",\\\"Meta do Dia\\\":\\\"Controlar o consumo de CPU
        e RAM dos processos conteinerizados.\\\",\\\"O Qu\xEA Pesquisar (Teoria)\\\":[\\\"Flags
        de limite de mem\xF3ria (--memory).\\\",\\\"Flags de compartilhamento de CPU
