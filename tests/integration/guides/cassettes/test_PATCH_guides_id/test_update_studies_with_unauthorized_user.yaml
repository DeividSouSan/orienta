        p\xFAblica.\\\",\\\"Verifica\xE7\xE3o de Aprendizado\\\":\\\"Para qual finalidade
        se usa o comando 'docker tag' antes do push?\\\"},{\\\"day\\\":19,\\\"title\\\":\\\"Introdu\xE7\xE3o
        ao Docker Compose\\\",\\\"Meta do Dia\\\":\\\"Gerenciar pilhas de servi\xE7os
