        Avan\xE7ado e DNS\\\",\\\"Meta do Dia\\\":\\\"Conectar v\xE1rios cont\xEAineres
        em uma rede privada.\\\",\\\"O Qu\xEA Pesquisar (Teoria)\\\":[\\\"Cria\xE7\xE3o
