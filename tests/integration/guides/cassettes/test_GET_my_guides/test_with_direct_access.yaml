  response:
    body:
      string: "{\n  \"candidates\": [\n    {\n      \"content\": {\n        \"parts\":
        [\n          {\n            \"text\": \"[\\n    {\\n        \\\"day\\\": 1,\\n
        \       \\\"title\\\": \\\"Introdu\xE7\xE3o ao Docker\\\",\\n        \\\"Meta
        do Dia\\\": \\\"Compreender o que \xE9 Docker, seus benef\xEDcios e a diferen\xE7a
        entre containers e m\xE1quinas virtuais.\\\",\\n        \\\"O Qu\xEA Pesquisar
        (Teoria)\\\": [\\n            \\\"O que \xE9 Docker?\\\",\\n            \\\"Benef\xEDcios
        do uso de containers Docker\\\",\\n            \\\"Diferen\xE7a entre Docker
        Containers e M\xE1quinas Virtuais (VMs)\\\"\\n        ],\\n        \\\"M\xE3o
        na Massa (Pr\xE1tica)\\\": \\\"Instalar o Docker Desktop em seu sistema operacional.
        Criar uma conta no Docker Hub.\\\",\\n        \\\"Verifica\xE7\xE3o de Aprendizado\\\":
        \\\"Explique em suas pr\xF3prias palavras por que o Docker \xE9 \xFAtil para
        o desenvolvimento de software.\\\"\\n    },\\n    {\\n        \\\"day\\\":
        2,\\n        \\\"title\\\": \\\"Conceitos Fundamentais: Imagens e Containers\\\",\\n
        \       \\\"Meta do Dia\\\": \\\"Entender a rela\xE7\xE3o entre imagens e
        containers e como eles s\xE3o criados e gerenciados.\\\",\\n        \\\"O
        Qu\xEA Pesquisar (Teoria)\\\": [\\n            \\\"O que s\xE3o Imagens Docker?\\\",\\n
        \           \\\"O que s\xE3o Containers Docker?\\\",\\n            \\\"Como
        uma imagem se torna um container?\\\"\\n        ],\\n        \\\"M\xE3o na
        Massa (Pr\xE1tica)\\\": \\\"Executar um container simples a partir de uma
        imagem oficial (ex: nginx ou ubuntu). Listar e parar o container.\\\",\\n
        \       \\\"Verifica\xE7\xE3o de Aprendizado\\\": \\\"Qual a diferen\xE7a
        fundamental entre uma imagem Docker e um container Docker em execu\xE7\xE3o?\\\"\\n
        \   },\\n    {\\n        \\\"day\\\": 3,\\n        \\\"title\\\": \\\"Comandos
        Essenciais: Gerenciamento de Containers\\\",\\n        \\\"Meta do Dia\\\":
        \\\"Aprender e praticar os comandos b\xE1sicos para iniciar, parar, remover
        e inspecionar containers.\\\",\\n        \\\"O Qu\xEA Pesquisar (Teoria)\\\":
        [\\n            \\\"Comando `docker run` e suas op\xE7\xF5es comuns (-d, -p,
        --name)\\\",\\n            \\\"Comandos `docker ps`, `docker stop`, `docker
        start`, `docker restart`, `docker rm`\\\",\\n            \\\"Comando `docker
        logs`\\\"\\n        ],\\n        \\\"M\xE3o na Massa (Pr\xE1tica)\\\": \\\"Iniciar
        um container em modo detached, verificar se est\xE1 rodando, ver seus logs,
        par\xE1-lo e remov\xEA-lo. Tentar remover um container em execu\xE7\xE3o e
        observar o erro.\\\",\\n        \\\"Verifica\xE7\xE3o de Aprendizado\\\":
        \\\"Descreva o fluxo para executar um container, verificar seu status, ver
        seus logs e, finalmente, remov\xEA-lo.\\\"\\n    },\\n    {\\n        \\\"day\\\":
        4,\\n        \\\"title\\\": \\\"Construindo Imagens: Dockerfile (Parte 1)\\\",\\n
        \       \\\"Meta do Dia\\\": \\\"Compreender a estrutura e os comandos b\xE1sicos
        de um Dockerfile para criar imagens customizadas.\\\",\\n        \\\"O Qu\xEA
        Pesquisar (Teoria)\\\": [\\n            \\\"O que \xE9 um Dockerfile?\\\",\\n
        \           \\\"Comandos `FROM`, `RUN`, `COPY`, `WORKDIR`\\\",\\n            \\\"No\xE7\xF5es
        de camadas de imagem\\\"\\n        ],\\n        \\\"M\xE3o na Massa (Pr\xE1tica)\\\":
        \\\"Criar um Dockerfile simples que instale um pacote em uma imagem base (ex:
        instalar o curl em ubuntu) e construir a imagem usando `docker build`.\\\",\\n
        \       \\\"Verifica\xE7\xE3o de Aprendizado\\\": \\\"Qual a fun\xE7\xE3o
        do comando `RUN` dentro de um Dockerfile?\\\"\\n    },\\n    {\\n        \\\"day\\\":
        5,\\n        \\\"title\\\": \\\"Construindo Imagens: Dockerfile (Parte 2)\\\",\\n
        \       \\\"Meta do Dia\\\": \\\"Aprender a expor portas, definir o comando
        de inicializa\xE7\xE3o e usar vari\xE1veis de ambiente em Dockerfiles.\\\",\\n
        \       \\\"O Qu\xEA Pesquisar (Teoria)\\\": [\\n            \\\"Comandos
        `EXPOSE`, `CMD`, `ENTRYPOINT`, `ENV`\\\",\\n            \\\"Melhores pr\xE1ticas
        para Dockerfiles (ex: .dockerignore)\\\"\\n        ],\\n        \\\"M\xE3o
        na Massa (Pr\xE1tica)\\\": \\\"Criar um Dockerfile para uma aplica\xE7\xE3o
        web simples (ex: um servidor python http.server com um arquivo HTML) que exponha
        uma porta e tenha um `CMD` definido. Construir a imagem e rodar um container,
        acessando a aplica\xE7\xE3o.\\\",\\n        \\\"Verifica\xE7\xE3o de Aprendizado\\\":
        \\\"Qual a diferen\xE7a entre `CMD` e `ENTRYPOINT` em um Dockerfile e quando
        usar cada um?\\\"\\n    },\\n    {\\n        \\\"day\\\": 6,\\n        \\\"title\\\":
        \\\"Gerenciando Dados: Volumes e Bind Mounts\\\",\\n        \\\"Meta do Dia\\\":
        \\\"Entender como persistir dados e compartilhar arquivos entre o host e os
        containers usando volumes e bind mounts.\\\",\\n        \\\"O Qu\xEA Pesquisar
        (Teoria)\\\": [\\n            \\\"O que s\xE3o Volumes Docker?\\\",\\n            \\\"O
        que s\xE3o Bind Mounts?\\\",\\n            \\\"Diferen\xE7as e casos de uso
        para Volumes e Bind Mounts\\\",\\n            \\\"Comando `docker volume`\\\"\\n
        \       ],\\n        \\\"M\xE3o na Massa (Pr\xE1tica)\\\": \\\"Criar um container
        que grave logs em um volume persistente. Criar outro container usando bind
        mount para montar um diret\xF3rio local com um arquivo de configura\xE7\xE3o.\\\",\\n
        \       \\\"Verifica\xE7\xE3o de Aprendizado\\\": \\\"Por que \xE9 importante
        usar volumes ou bind mounts para dados que precisam ser persistidos ou compartilhados?\\\"\\n
        \   },\\n    {\\n        \\\"day\\\": 7,\\n        \\\"title\\\": \\\"Redes
        Docker\\\",\\n        \\\"Meta do Dia\\\": \\\"Compreender os diferentes tipos
        de redes Docker e como os containers se comunicam entre si.\\\",\\n        \\\"O
        Qu\xEA Pesquisar (Teoria)\\\": [\\n            \\\"Redes Bridge (padr\xE3o)\\\",\\n
        \           \\\"Redes Host\\\",\\n            \\\"Redes None\\\",\\n            \\\"Criando
        redes customizadas (`docker network create`)\\\"\\n        ],\\n        \\\"M\xE3o
        na Massa (Pr\xE1tica)\\\": \\\"Criar duas redes bridge customizadas. Iniciar
