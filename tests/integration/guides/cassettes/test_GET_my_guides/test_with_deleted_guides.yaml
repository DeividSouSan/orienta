  response:
    body:
      string: "{\n  \"candidates\": [\n    {\n      \"content\": {\n        \"parts\":
        [\n          {\n            \"text\": \"[\\n  {\\n    \\\"day\\\": 1,\\n    \\\"title\\\":
        \\\"Fundamentos da Virtualiza\xE7\xE3o\\\",\\n    \\\"Meta do Dia\\\": \\\"Entender
        o que motivou a cria\xE7\xE3o do Docker comparando-o com M\xE1quinas Virtuais.\\\",\\n
        \   \\\"O Qu\xEA Pesquisar (Teoria)\\\": [\\n      \\\"O que \xE9 virtualiza\xE7\xE3o
        de n\xEDvel de SO?\\\",\\n      \\\"Qual a diferen\xE7a fundamental entre
        containers e M\xE1quinas Virtuais (VMs)?\\\",\\n      \\\"O que \xE9 o conceito
        de Isolamento no kernel do Linux?\\\"\\n    ],\\n    \\\"M\xE3o na Massa (Pr\xE1tica)\\\":
        \\\"Pesquisar e desenhar um diagrama comparando as camadas de uma VM (Hypervisor)
        e de um Container (Container Runtime).\\\",\\n    \\\"Verifica\xE7\xE3o de
        Aprendizado\\\": \\\"Por que containers s\xE3o considerados mais leves do
        que m\xE1quinas virtuais?\\\"\\n  },\\n  {\\n    \\\"day\\\": 2,\\n    \\\"title\\\":
        \\\"Arquitetura do Docker\\\",\\n    \\\"Meta do Dia\\\": \\\"Compreender
        como o Docker Engine funciona nos bastidores.\\\",\\n    \\\"O Qu\xEA Pesquisar
        (Teoria)\\\": [\\n      \\\"O que \xE9 o Docker Daemon?\\\",\\n      \\\"Qual
        a fun\xE7\xE3o do Docker Client e da Docker REST API?\\\",\\n      \\\"O que
        \xE9 o Docker Registry (Docker Hub)?\\\"\\n    ],\\n    \\\"M\xE3o na Massa
        (Pr\xE1tica)\\\": \\\"Acessar o site do Docker Hub e navegar pelas imagens
        mais populares (como Nginx e Ubuntu) para entender a estrutura de tags.\\\",\\n
        \   \\\"Verifica\xE7\xE3o de Aprendizado\\\": \\\"Qual componente \xE9 respons\xE1vel
        por gerenciar os objetos do Docker (Imagens e Containers)?\\\"\\n  },\\n  {\\n
        \   \\\"day\\\": 3,\\n    \\\"title\\\": \\\"Ambiente e Primeiros Passos\\\",\\n
        \   \\\"Meta do Dia\\\": \\\"Configurar o ambiente e realizar o teste b\xE1sico
        de funcionamento.\\\",\\n    \\\"O Qu\xEA Pesquisar (Teoria)\\\": [\\n      \\\"Como
        instalar o Docker Desktop (Windows/Mac) ou Docker Engine (Linux)?\\\",\\n
        \     \\\"Para que serve o comando 'docker version'?\\\",\\n      \\\"Para
        que serve o comando 'docker info'?\\\"\\n    ],\\n    \\\"M\xE3o na Massa
        (Pr\xE1tica)\\\": \\\"Instalar o Docker no computador e executar o comando
        'docker version' para garantir que o Client e o Server est\xE3o ativos.\\\",\\n
        \   \\\"Verifica\xE7\xE3o de Aprendizado\\\": \\\"Qual a principal informa\xE7\xE3o
        retornada pelo comando 'docker info'?\\\"\\n  },\\n  {\\n    \\\"day\\\":
        4,\\n    \\\"title\\\": \\\"Ol\xE1, Docker!\\\",\\n    \\\"Meta do Dia\\\":
        \\\"Executar seu primeiro container e entender o fluxo b\xE1sico de execu\xE7\xE3o.\\\",\\n
        \   \\\"O Qu\xEA Pesquisar (Teoria)\\\": [\\n      \\\"O que acontece internamente
        quando rodamos o comando 'docker run hello-world'?\\\",\\n      \\\"Qual a
        diferen\xE7a entre uma Imagem e um Container?\\\"\\n    ],\\n    \\\"M\xE3o
        na Massa (Pr\xE1tica)\\\": \\\"Executar o container 'hello-world' e observar
        a mensagem de sa\xEDda no terminal.\\\",\\n    \\\"Verifica\xE7\xE3o de Aprendizado\\\":
        \\\"O container permanece ativo ap\xF3s exibir a mensagem do hello-world?
        Por qu\xEA?\\\"\\n  },\\n  {\\n    \\\"day\\\": 5,\\n    \\\"title\\\": \\\"Gest\xE3o
        de Imagens - Parte 1\\\",\\n    \\\"Meta do Dia\\\": \\\"Aprender a localizar
        e baixar imagens para o sistema local.\\\",\\n    \\\"O Qu\xEA Pesquisar (Teoria)\\\":
        [\\n      \\\"Como funciona o comando 'docker pull'?\\\",\\n      \\\"Como
        pesquisar imagens no terminal usando 'docker search'?\\\",\\n      \\\"O que
        \xE9 uma Tag de imagem (ex: 'latest' vs 'alpine')?\\\"\\n    ],\\n    \\\"M\xE3o
        na Massa (Pr\xE1tica)\\\": \\\"Pesquisar por imagens do servidor 'nginx' e
        realizar o pull da vers\xE3o 'alpine' e da vers\xE3o 'latest'.\\\",\\n    \\\"Verifica\xE7\xE3o
        de Aprendizado\\\": \\\"Para que serve a tag 'latest' no Docker?\\\"\\n  },\\n
        \ {\\n    \\\"day\\\": 6,\\n    \\\"title\\\": \\\"Gest\xE3o de Imagens -
        Parte 2\\\",\\n    \\\"Meta do Dia\\\": \\\"Aprender a administrar as imagens
        armazenadas localmente.\\\",\\n    \\\"O Qu\xEA Pesquisar (Teoria)\\\": [\\n
        \     \\\"Como listar as imagens locais com 'docker images'?\\\",\\n      \\\"Como
        deletar imagens usando 'docker rmi'?\\\",\\n      \\\"O que \xE9 o Image ID?\\\"\\n
        \   ],\\n    \\\"M\xE3o na Massa (Pr\xE1tica)\\\": \\\"Listar todas as imagens
        baixadas nos dias anteriores, inspecionar os tamanhos e deletar a imagem do
        'hello-world'.\\\",\\n    \\\"Verifica\xE7\xE3o de Aprendizado\\\": \\\"\xC9
        poss\xEDvel deletar uma imagem que possui um container criado a partir dela
        (mesmo que parado)?\\\"\\n  },\\n  {\\n    \\\"day\\\": 7,\\n    \\\"title\\\":
        \\\"Ciclo de Vida de Containers - Parte 1\\\",\\n    \\\"Meta do Dia\\\":
        \\\"Dominar os comandos b\xE1sicos de execu\xE7\xE3o e parada.\\\",\\n    \\\"O
        Qu\xEA Pesquisar (Teoria)\\\": [\\n      \\\"Qual a diferen\xE7a entre 'docker
        run', 'docker start' e 'docker create'?\\\",\\n      \\\"Como o comando 'docker
        stop' encerra um processo?\\\",\\n      \\\"O que \xE9 o Container ID e o
        Container Name?\\\"\\n    ],\\n    \\\"M\xE3o na Massa (Pr\xE1tica)\\\": \\\"Criar
        um container nginx, renome\xE1-lo, par\xE1-lo e inici\xE1-lo novamente usando
        o nome atribu\xEDdo.\\\",\\n    \\\"Verifica\xE7\xE3o de Aprendizado\\\":
        \\\"Qual comando reinicia um container que j\xE1 foi criado anteriormente
        mas est\xE1 no estado 'exited'?\\\"\\n  },\\n  {\\n    \\\"day\\\": 8,\\n
        \   \\\"title\\\": \\\"Ciclo de Vida de Containers - Parte 2\\\",\\n    \\\"Meta
        do Dia\\\": \\\"Aprender a listar e remover containers do sistema.\\\",\\n
        \   \\\"O Qu\xEA Pesquisar (Teoria)\\\": [\\n      \\\"Como ver todos os containers
        (ativos e inativos) com 'docker ps -a'?\\\",\\n      \\\"Qual a diferen\xE7a
        entre 'docker stop' e 'docker rm'?\\\",\\n      \\\"O que o par\xE2metro '--rm'
        faz ao ser usado no 'docker run'?\\\"\\n    ],\\n    \\\"M\xE3o na Massa (Pr\xE1tica)\\\":
        \\\"Listar todos os containers acumulados, remover todos os containers parados
        individualmente e depois usar 'docker container prune'.\\\",\\n    \\\"Verifica\xE7\xE3o
        de Aprendizado\\\": \\\"Qual o comando para listar apenas os IDs dos containers
        ativos?\\\"\\n  },\\n  {\\n    \\\"day\\\": 9,\\n    \\\"title\\\": \\\"Modo
        Interativo e Execu\xE7\xE3o Externa\\\",\\n    \\\"Meta do Dia\\\": \\\"Entrar
        dentro de um container e manipular arquivos em tempo real.\\\",\\n    \\\"O
        Qu\xEA Pesquisar (Teoria)\\\": [\\n      \\\"O que as flags '-i' e '-t' significam?\\\",\\n
        \     \\\"Qual a utilidade do comando 'docker exec'?\\\",\\n      \\\"Diferen\xE7a
        entre anexar ('attach') e executar ('exec').\\\"\\n    ],\\n    \\\"M\xE3o
        na Massa (Pr\xE1tica)\\\": \\\"Rodar um container Ubuntu em modo interativo
        ('bash'), criar um arquivo dentro dele, sair e tentar ver se o arquivo persiste
        ao usar 'docker exec'.\\\",\\n    \\\"Verifica\xE7\xE3o de Aprendizado\\\":
        \\\"Qual o comando para rodar um comando dentro de um container que j\xE1
        est\xE1 em execu\xE7\xE3o sem entrar no modo interativo?\\\"\\n  },\\n  {\\n
        \   \\\"day\\\": 10,\\n    \\\"title\\\": \\\"Monitoramento e Logs\\\",\\n
        \   \\\"Meta do Dia\\\": \\\"Aprender a investigar o que est\xE1 acontecendo
        dentro do container.\\\",\\n    \\\"O Qu\xEA Pesquisar (Teoria)\\\": [\\n
        \     \\\"Para que serve o comando 'docker logs'?\\\",\\n      \\\"Como monitorar
        o consumo de CPU e RAM com 'docker stats'?\\\",\\n      \\\"Como ver as portas
        e IPs do container com 'docker inspect'?\\\"\\n    ],\\n    \\\"M\xE3o na
        Massa (Pr\xE1tica)\\\": \\\"Rodar um servidor nginx, acessar o terminal de
        logs com '-f' (follow) e simular acessos (mesmo que falhos) para ver a atualiza\xE7\xE3o
        dos logs.\\\",\\n    \\\"Verifica\xE7\xE3o de Aprendizado\\\": \\\"Qual comando
        fornece todos os detalhes em JSON de um container espec\xEDfico?\\\"\\n  },\\n
        \ {\\n    \\\"day\\\": 11,\\n    \\\"title\\\": \\\"Persist\xEAncia com Volumes\\\",\\n
        \   \\\"Meta do Dia\\\": \\\"Entender como salvar dados fora do container
        para evitar perda de informa\xE7\xF5es.\\\",\\n    \\\"O Qu\xEA Pesquisar
        (Teoria)\\\": [\\n      \\\"O que \xE9 a camada de Read/Write do container?\\\",\\n
        \     \\\"Qual a diferen\xE7a entre Bind Mount e Named Volume?\\\",\\n      \\\"Como
        usar a flag '-v' no Docker Run?\\\"\\n    ],\\n    \\\"M\xE3o na Massa (Pr\xE1tica)\\\":
        \\\"Rodar um container nginx mapeando uma pasta do seu computador para o diret\xF3rio
        de HTML do nginx no container.\\\",\\n    \\\"Verifica\xE7\xE3o de Aprendizado\\\":
        \\\"O que acontece com os dados de um container removido se eles estiverem
        armazenados em um Volume?\\\"\\n  },\\n  {\\n    \\\"day\\\": 12,\\n    \\\"title\\\":
        \\\"Redes e Portas\\\",\\n    \\\"Meta do Dia\\\": \\\"Expor servi\xE7os do
        Docker para o navegador e comunicar containers entre si.\\\",\\n    \\\"O
        Qu\xEA Pesquisar (Teoria)\\\": [\\n      \\\"O que \xE9 o mapeamento de portas
        ('-p' host_port:container_port)?\\\",\\n      \\\"Quais os drivers de rede
        padr\xE3o do Docker (Bridge, Host, None)?\\\",\\n      \\\"Como containers
        se comunicam na mesma rede?\\\"\\n    ],\\n    \\\"M\xE3o na Massa (Pr\xE1tica)\\\":
        \\\"Subir um container nginx na porta 8080 do seu PC e testar o acesso via
        navegador ('localhost:8080').\\\",\\n    \\\"Verifica\xE7\xE3o de Aprendizado\\\":
        \\\"Se eu rodar um container na porta 80 interna, posso acess\xE1-lo na porta
        80 do host sem o par\xE2metro '-p'?\\\"\\n  },\\n  {\\n    \\\"day\\\": 13,\\n
        \   \\\"title\\\": \\\"Criando Imagens: Dockerfile B\xE1sico\\\",\\n    \\\"Meta
        do Dia\\\": \\\"Automatizar a cria\xE7\xE3o de imagens customizadas.\\\",\\n
        \   \\\"O Qu\xEA Pesquisar (Teoria)\\\": [\\n      \\\"O que \xE9 o arquivo
        'Dockerfile'?\\\",\\n      \\\"Para que servem as instru\xE7\xF5es 'FROM',
        'WORKDIR' e 'COPY'?\\\",\\n      \\\"Como as camadas de imagem s\xE3o formadas?\\\"\\n
        \   ],\\n    \\\"M\xE3o na Massa (Pr\xE1tica)\\\": \\\"Criar um Dockerfile
        que utilize uma imagem base do Ubuntu e copie um arquivo de texto 'README.txt'
        do seu computador para dentro do container.\\\",\\n    \\\"Verifica\xE7\xE3o
        de Aprendizado\\\": \\\"Qual instru\xE7\xE3o define a imagem inicial para
        o seu Dockerfile?\\\"\\n  },\\n  {\\n    \\\"day\\\": 14,\\n    \\\"title\\\":
        \\\"Dockerfile Avan\xE7ado\\\",\\n    \\\"Meta do Dia\\\": \\\"Configurar
        a execu\xE7\xE3o autom\xE1tica de comandos na imagem.\\\",\\n    \\\"O Qu\xEA
        Pesquisar (Teoria)\\\": [\\n      \\\"Qual a diferen\xE7a entre 'RUN', 'CMD'
        e 'ENTRYPOINT'?\\\",\\n      \\\"Como declarar vari\xE1veis de ambiente com
        'ENV'?\\\",\\n      \\\"O que faz a instru\xE7\xE3o 'EXPOSE'?\\\"\\n    ],\\n
        \   \\\"M\xE3o na Massa (Pr\xE1tica)\\\": \\\"Editar o Dockerfile anterior
        para instalar o comando 'curl' (via apt-get) e definir que, ao iniciar, o
        container deve executar 'curl --version'.\\\",\\n    \\\"Verifica\xE7\xE3o
        de Aprendizado\\\": \\\"Quantas instru\xE7\xF5es 'CMD' podem existir efetivamente
        em um \xFAnico Dockerfile?\\\"\\n  },\\n  {\\n    \\\"day\\\": 15,\\n    \\\"title\\\":
        \\\"O comando Build\\\",\\n    \\\"Meta do Dia\\\": \\\"Transformar o Dockerfile
        em uma imagem utiliz\xE1vel.\\\",\\n    \\\"O Qu\xEA Pesquisar (Teoria)\\\":
        [\\n      \\\"Como funciona o comando 'docker build'?\\\",\\n      \\\"O que
        \xE9 o Contexto de Build (o ponto final '.' no comando)?\\\",\\n      \\\"Como
        usar o par\xE2metro '-t' para taguear a nova imagem?\\\"\\n    ],\\n    \\\"M\xE3o
        na Massa (Pr\xE1tica)\\\": \\\"Gerar a imagem a partir do Dockerfile criado
        nos dias anteriores com o nome 'meu-primeiro-docker' e rodar um container
        baseado nela.\\\",\\n    \\\"Verifica\xE7\xE3o de Aprendizado\\\": \\\"Por
        que o comando build precisa que voc\xEA especifique um caminho ou diret\xF3rio?\\\"\\n
        \ },\\n  {\\n    \\\"day\\\": 16,\\n    \\\"title\\\": \\\"Introdu\xE7\xE3o
        ao Docker Compose\\\",\\n    \\\"Meta do Dia\\\": \\\"Orquestrar m\xFAltiplos
        containers de forma simples com arquivos YAML.\\\",\\n    \\\"O Qu\xEA Pesquisar
        (Teoria)\\\": [\\n      \\\"Para que serve o Docker Compose?\\\",\\n      \\\"Qual
        a estrutura de um arquivo 'docker-compose.yml'?\\\",\\n      \\\"Diferen\xE7a
        entre 'docker-compose up' e 'docker-compose down'.\\\"\\n    ],\\n    \\\"M\xE3o
        na Massa (Pr\xE1tica)\\\": \\\"Instalar o Docker Compose (se n\xE3o estiver
        incluso) e criar um arquivo simples para rodar apenas um servi\xE7o de redis.\\\",\\n
        \   \\\"Verifica\xE7\xE3o de Aprendizado\\\": \\\"Qual o comando para rodar
        os servi\xE7os do compose em segundo plano (background)?\\\"\\n  },\\n  {\\n
        \   \\\"day\\\": 17,\\n    \\\"title\\\": \\\"Orquestra\xE7\xE3o Multi-container\\\",\\n
        \   \\\"Meta do Dia\\\": \\\"Subir uma aplica\xE7\xE3o e um banco de dados
        simultaneamente.\\\",\\n    \\\"O Qu\xEA Pesquisar (Teoria)\\\": [\\n      \\\"Como
        o Compose cria uma rede autom\xE1tica para os servi\xE7os?\\\",\\n      \\\"Uso
        da diretiva 'depends_on'?\\\",\\n      \\\"Como definir volumes no Compose?\\\"\\n
        \   ],\\n    \\\"M\xE3o na Massa (Pr\xE1tica)\\\": \\\"Criar um 'docker-compose.yml'
        que configure um banco de dados MySQL e uma ferramenta visual (como Adminer)
        interconectados.\\\",\\n    \\\"Verifica\xE7\xE3o de Aprendizado\\\": \\\"No
        Docker Compose, como um container referencia outro container na rede?\\\"\\n
        \ },\\n  {\\n    \\\"day\\\": 18,\\n    \\\"title\\\": \\\"Limpeza e Boas
        Pr\xE1ticas\\\",\\n    \\\"Meta do Dia\\\": \\\"Otimizar imagens e limpar
        o ambiente de desenvolvimento.\\\",\\n    \\\"O Qu\xEA Pesquisar (Teoria)\\\":
        [\\n      \\\"Como criar imagens menores (Multistage build b\xE1sico)?\\\",\\n
        \     \\\"O que \xE9 o arquivo '.dockerignore'?\\\",\\n      \\\"O que \xE9
        o comando 'docker system prune -a'?\\\"\\n    ],\\n    \\\"M\xE3o na Massa
        (Pr\xE1tica)\\\": \\\"Realizar uma limpeza completa de volumes, imagens n\xE3o
        utilizadas e redes no seu Docker para finalizar o guia de estudos.\\\",\\n
        \   \\\"Verifica\xE7\xE3o de Aprendizado\\\": \\\"Para que serve o arquivo
        '.dockerignore' em rela\xE7\xE3o ao tamanho da imagem final?\\\"\\n  }\\n]\",\n
        \           \"thoughtSignature\": \"\"\n
