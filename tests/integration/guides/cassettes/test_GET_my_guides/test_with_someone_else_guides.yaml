        \       \"modality\": \"TEXT\",\n        \"tokenCount\": 776\n      }\n    ],\n
        \   \"cacheTokensDetails\": [\n      {\n        \"modality\": \"TEXT\",\n
        \       \"tokenCount\": 533\n      }\n    ]\n  },\n  \"modelVersion\": \"gemini-2.5-flash-lite\",\n
        \ \"responseId\": \"MkLtafeyMqXnqtsP_-3bwQo\"\n}\n"
