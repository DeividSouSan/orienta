      string: "{\n  \"candidates\": [\n    {\n      \"content\": {\n        \"parts\":
        [\n          {\n            \"text\": \"[\\n    {\\n        \\\"day\\\": 1,\\n
        \       \\\"title\\\": \\\"Introdu\xE7\xE3o ao Docker e Conceitos Fundamentais\\\",\\n
        \       \\\"Meta do Dia\\\": \\\"Compreender o que \xE9 Docker e seus principais
        conceitos, como containers e imagens.\\\",\\n        \\\"O Qu\xEA Pesquisar
        (Teoria)\\\": [\\n            \\\"O que \xE9 Docker?\\\",\\n            \\\"Diferen\xE7a
        entre container e m\xE1quina virtual.\\\",\\n            \\\"O que s\xE3o
        imagens Docker?\\\"\\n        ],\\n        \\\"M\xE3o na Massa (Pr\xE1tica)\\\":
        \\\"Instalar o Docker Desktop e rodar o comando 'docker --version' para confirmar
        a instala\xE7\xE3o.\\\",\\n        \\\"Verifica\xE7\xE3o de Aprendizado\\\":
        \\\"Quais s\xE3o os dois componentes principais do Docker que voc\xEA aprendeu
        hoje e qual a sua fun\xE7\xE3o b\xE1sica?\\\"\\n    },\\n    {\\n        \\\"day\\\":
        2,\\n        \\\"title\\\": \\\"Primeiros Passos com Imagens Docker\\\",\\n
        \       \\\"Meta do Dia\\\": \\\"Aprender a buscar, baixar e listar imagens
        Docker.\\\",\\n        \\\"O Qu\xEA Pesquisar (Teoria)\\\": [\\n            \\\"Como
        buscar imagens no Docker Hub (docker search).\\\",\\n            \\\"Como
        baixar imagens (docker pull).\\\",\\n            \\\"Como listar imagens baixadas
        (docker images).\\\"\\n        ],\\n        \\\"M\xE3o na Massa (Pr\xE1tica)\\\":
        \\\"Buscar uma imagem de um sistema operacional (ex: Ubuntu), baix\xE1-la
        e listar todas as imagens locais.\\\",\\n        \\\"Verifica\xE7\xE3o de
        Aprendizado\\\": \\\"Qual comando voc\xEA usaria para baixar a vers\xE3o mais
        recente da imagem 'nginx'?\\\"\\n    },\\n    {\\n        \\\"day\\\": 3,\\n
        \       \\\"title\\\": \\\"Executando seu Primeiro Container\\\",\\n        \\\"Meta
        do Dia\\\": \\\"Compreender como iniciar e gerenciar um container a partir
        de uma imagem.\\\",\\n        \\\"O Qu\xEA Pesquisar (Teoria)\\\": [\\n            \\\"Como
        executar um container (docker run).\\\",\\n            \\\"Containers interativos
        vs. detached (background).\\\",\\n            \\\"Par\xE2metros b\xE1sicos
        do docker run (nome, porta).\\\"\\n        ],\\n        \\\"M\xE3o na Massa
        (Pr\xE1tica)\\\": \\\"Executar um container Ubuntu em modo interativo, instalar
        um pacote simples (ex: nano) e sair.\\\",\\n        \\\"Verifica\xE7\xE3o
        de Aprendizado\\\": \\\"Qual a diferen\xE7a entre executar um container em
        modo interativo e em modo detached?\\\"\\n    },\\n    {\\n        \\\"day\\\":
        4,\\n        \\\"title\\\": \\\"Gerenciamento de Containers em Execu\xE7\xE3o\\\",\\n
        \       \\\"Meta do Dia\\\": \\\"Aprender a listar, inspecionar, parar e remover
        containers.\\\",\\n        \\\"O Qu\xEA Pesquisar (Teoria)\\\": [\\n            \\\"Listar
        containers em execu\xE7\xE3o (docker ps).\\\",\\n            \\\"Listar todos
        os containers (docker ps -a).\\\",\\n            \\\"Inspecionar um container
        (docker inspect).\\\",\\n            \\\"Parar e iniciar containers (docker
        stop, docker start).\\\",\\n            \\\"Remover containers (docker rm).\\\"\\n
        \       ],\\n        \\\"M\xE3o na Massa (Pr\xE1tica)\\\": \\\"Executar um
        container nginx, inspecion\xE1-lo, par\xE1-lo e remov\xEA-lo.\\\",\\n        \\\"Verifica\xE7\xE3o
        de Aprendizado\\\": \\\"Como voc\xEA veria um container que foi parado anteriormente?\\\"\\n
        \   },\\n    {\\n        \\\"day\\\": 5,\\n        \\\"title\\\": \\\"Introdu\xE7\xE3o
        aos Dockerfiles\\\",\\n        \\\"Meta do Dia\\\": \\\"Entender o prop\xF3sito
        de um Dockerfile e seus comandos b\xE1sicos.\\\",\\n        \\\"O Qu\xEA Pesquisar
        (Teoria)\\\": [\\n            \\\"O que \xE9 um Dockerfile?\\\",\\n            \\\"Comando
        `FROM` para especificar a imagem base.\\\",\\n            \\\"Comando `RUN`
        para executar comandos durante a build.\\\",\\n            \\\"Comando `COPY`
        ou `ADD` para adicionar arquivos.\\\"\\n        ],\\n        \\\"M\xE3o na
        Massa (Pr\xE1tica)\\\": \\\"Criar um Dockerfile simples para uma aplica\xE7\xE3o
        'Hello World' que copia um script e o executa.\\\",\\n        \\\"Verifica\xE7\xE3o
        de Aprendizado\\\": \\\"Qual comando em um Dockerfile \xE9 usado para instalar
        software dentro da imagem?\\\"\\n    },\\n    {\\n        \\\"day\\\": 6,\\n
        \       \\\"title\\\": \\\"Construindo Imagens com Dockerfiles\\\",\\n        \\\"Meta
        do Dia\\\": \\\"Aprender a construir uma imagem Docker a partir de um Dockerfile.\\\",\\n
        \       \\\"O Qu\xEA Pesquisar (Teoria)\\\": [\\n            \\\"Comando `docker
        build`.\\\",\\n            \\\"O que \xE9 o contexto de build.\\\",\\n            \\\"O
        que \xE9 o `.` no final do comando build.\\\"\\n        ],\\n        \\\"M\xE3o
        na Massa (Pr\xE1tica)\\\": \\\"Construir a imagem criada no dia anterior usando
        `docker build` e verificar se ela aparece na lista de imagens.\\\",\\n        \\\"Verifica\xE7\xE3o
        de Aprendizado\\\": \\\"Explique o que significa o `.` no final do comando
        `docker build .`\\\"\\n    },\\n    {\\n        \\\"day\\\": 7,\\n        \\\"title\\\":
        \\\"Comandos `CMD` e `ENTRYPOINT`\\\",\\n        \\\"Meta do Dia\\\": \\\"Diferenciar
        e usar os comandos `CMD` e `ENTRYPOINT` em um Dockerfile.\\\",\\n        \\\"O
        Qu\xEA Pesquisar (Teoria)\\\": [\\n            \\\"Fun\xE7\xE3o e uso do `CMD`.\\\",\\n
        \           \\\"Fun\xE7\xE3o e uso do `ENTRYPOINT`.\\\",\\n            \\\"Intera\xE7\xE3o
        entre `CMD` e `ENTRYPOINT`.\\\"\\n        ],\\n        \\\"M\xE3o na Massa
        (Pr\xE1tica)\\\": \\\"Criar um Dockerfile que use tanto `CMD` quanto `ENTRYPOINT`
        para executar um script e testar diferentes formas de iniciar o container.\\\",\\n
        \       \\\"Verifica\xE7\xE3o de Aprendizado\\\": \\\"Qual a principal diferen\xE7a
        entre `CMD` e `ENTRYPOINT` e como eles se complementam?\\\"\\n    },\\n    {\\n
        \       \\\"day\\\": 8,\\n        \\\"title\\\": \\\"Volumes: Persist\xEAncia
        de Dados\\\",\\n        \\\"Meta do Dia\\\": \\\"Compreender a import\xE2ncia
        e o uso de volumes para persistir dados.\\\",\\n        \\\"O Qu\xEA Pesquisar
