    body:
      string: "{\n  \"candidates\": [\n    {\n      \"content\": {\n        \"parts\":
        [\n          {\n            \"text\": \"[{\\\"day\\\":1,\\\"title\\\":\\\"Fundamentos
        de Containeriza\xE7\xE3o\\\",\\\"Meta do Dia\\\":\\\"Compreender o que s\xE3o
        containers e a proposta de valor do Docker.\\\",\\\"O Qu\xEA Pesquisar (Teoria)\\\":[\\\"O
        que \xE9 um container e isolamento de processo?\\\",\\\"Hist\xF3ria do Docker
        e por que ele revolucionou o mercado.\\\",\\\"Diferen\xE7a detalhada entre
        M\xE1quinas Virtuais (VM) e Containers Docker.\\\"],\\\"M\xE3o na Massa (Pr\xE1tica)\\\":\\\"Desenhar
        ou listar em t\xF3picos uma compara\xE7\xE3o de desempenho entre containers
        e m\xE1quinas virtuais.\\\",\\\"Verifica\xE7\xE3o de Aprendizado\\\":\\\"Por
        que os containers s\xE3o considerados mais leves que as m\xE1quinas virtuais
        tradicionais?\\\"},{\\\"day\\\":2,\\\"title\\\":\\\"Arquitetura e Ecossistema\\\",\\\"Meta
        do Dia\\\":\\\"Entender os componentes fundamentais que comp\xF5em o ecossistema
        Docker.\\\",\\\"O Qu\xEA Pesquisar (Teoria)\\\":[\\\"Componentes: Docker Client,
        Docker Host (Daemon) e Registry.\\\",\\\"O que \xE9 o Docker Desktop e o Engine?\\\",\\\"O
        conceito de Imagem versus Container.\\\"],\\\"M\xE3o na Massa (Pr\xE1tica)\\\":\\\"Criar
        um diagrama de blocos mostrando a comunica\xE7\xE3o entre o Docker CLI e o
        Daemon.\\\",\\\"Verifica\xE7\xE3o de Aprendizado\\\":\\\"Qual a fun\xE7\xE3o
        do Docker Daemon na arquitetura da plataforma?\\\"},{\\\"day\\\":3,\\\"title\\\":\\\"Ambiente
        e Primeiro Container\\\",\\\"Meta do Dia\\\":\\\"Instalar o Docker e executar
        o primeiro comando com sucesso.\\\",\\\"O Qu\xEA Pesquisar (Teoria)\\\":[\\\"Procedimentos
        de instala\xE7\xE3o para o sistema operacional alvo.\\\",\\\"O comando docker
        hello-world e o que ele faz internamente.\\\",\\\"Principais canais de documenta\xE7\xE3o
        oficial.\\\"],\\\"M\xE3o na Massa (Pr\xE1tica)\\\":\\\"Instalar o Docker e
        executar o comando 'docker run hello-world' via terminal.\\\",\\\"Verifica\xE7\xE3o
        de Aprendizado\\\":\\\"O que acontece no sistema quando voc\xEA executa uma
        imagem que n\xE3o existe localmente?\\\"},{\\\"day\\\":4,\\\"title\\\":\\\"Gerenciamento
        do Ciclo de Vida\\\",\\\"Meta do Dia\\\":\\\"Aprender a controlar o estado
        dos containers: criar, parar e remover.\\\",\\\"O Qu\xEA Pesquisar (Teoria)\\\":[\\\"Estados
        do container: Created, Running, Paused, Exited.\\\",\\\"Comandos 'docker ps'
        (e a flag -a) e 'docker run'.\\\",\\\"Diferen\xE7a entre docker stop e docker
        kill.\\\"],\\\"M\xE3o na Massa (Pr\xE1tica)\\\":\\\"Subir um container Nginx,
        verificar se est\xE1 rodando e depois remov\xEA-lo completamente.\\\",\\\"Verifica\xE7\xE3o
        de Aprendizado\\\":\\\"Qual comando voc\xEA usaria para listar apenas containers
        que est\xE3o parados?\\\"},{\\\"day\\\":5,\\\"title\\\":\\\"Trabalhando com
        Imagens\\\",\\\"Meta do Dia\\\":\\\"Entender a estrutura e como gerenciar
        as bibliotecas de imagens locais.\\\",\\\"O Qu\xEA Pesquisar (Teoria)\\\":[\\\"Comandos
        de gerenciamento de imagens: 'docker images', 'docker pull' e 'docker rmi'.\\\",\\\"Conceito
        de Tags e versionamento de imagens.\\\",\\\"O que \xE9 o Docker Hub e como
        buscar imagens oficiais.\\\"],\\\"M\xE3o na Massa (Pr\xE1tica)\\\":\\\"Baixar
        3 vers\xF5es diferentes de imagens (ex: Ubuntu:latest, Ubuntu:20.04) e listar
        suas diferen\xE7as de tamanho.\\\",\\\"Verifica\xE7\xE3o de Aprendizado\\\":\\\"Como
        o Docker diferencia duas imagens com o mesmo nome, mas vers\xF5es diferentes?\\\"},{\\\"day\\\":6,\\\"title\\\":\\\"Interatividade
        e Inspe\xE7\xE3o\\\",\\\"Meta do Dia\\\":\\\"Acessar e extrair informa\xE7\xF5es
        de dentro de um container em execu\xE7\xE3o.\\\",\\\"O Qu\xEA Pesquisar (Teoria)\\\":[\\\"Uso
        das flags '-it' no docker run.\\\",\\\"Comando 'docker exec' para rodar comandos
        em containers ativos.\\\",\\\"Como visualizar logs com 'docker logs'.\\\"],\\\"M\xE3o
        na Massa (Pr\xE1tica)\\\":\\\"Rodar um container Ubuntu em modo interativo,
        criar um arquivo dentro dele e sair.\\\",\\\"Verifica\xE7\xE3o de Aprendizado\\\":\\\"Qual
        o comando para abrir um terminal bash dentro de um container que j\xE1 est\xE1
        rodando?\\\"},{\\\"day\\\":7,\\\"title\\\":\\\"Mapeamento de Portas e Background\\\",\\\"Meta
        do Dia\\\":\\\"Compreender como disponibilizar servi\xE7os do container para
        a m\xE1quina real.\\\",\\\"O Qu\xEA Pesquisar (Teoria)\\\":[\\\"Publica\xE7\xE3o
        de portas com a flag '-p'.\\\",\\\"Modo Detached (-d) versus Forefround.\\\",\\\"O
        que \xE9 um Host Port e um Container Port.\\\"],\\\"M\xE3o na Massa (Pr\xE1tica)\\\":\\\"Rodar
        um servidor web Nginx em background mapeando a porta 8080 do host para a 80
        do container.\\\",\\\"Verifica\xE7\xE3o de Aprendizado\\\":\\\"O que ocorre
        se voc\xEA tentar rodar dois containers mapeando para a mesma porta do host?\\\"},{\\\"day\\\":8,\\\"title\\\":\\\"Constru\xE7\xE3o
        de Imagens (Dockerfile)\\\",\\\"Meta do Dia\\\":\\\"Aprender a criar imagens
        customizadas usando o Dockerfile.\\\",\\\"O Qu\xEA Pesquisar (Teoria)\\\":[\\\"Sintaxe
        do Dockerfile: FROM, RUN, CMD e ENTRYPOINT.\\\",\\\"Como funciona o 'docker
        build' e o Contexto de build.\\\",\\\"Conceito de camadas de imagem (layers).\\\"],\\\"M\xE3o
        na Massa (Pr\xE1tica)\\\":\\\"Escrever um Dockerfile para uma aplica\xE7\xE3o
        simples que apenas imprime 'Ol\xE1 Mundo' ao ser executada.\\\",\\\"Verifica\xE7\xE3o
        de Aprendizado\\\":\\\"Para que serve a instru\xE7\xE3o 'FROM' no in\xEDcio
        de quase todo Dockerfile?\\\"},{\\\"day\\\":9,\\\"title\\\":\\\"Avan\xE7ando
        no Dockerfile\\\",\\\"Meta do Dia\\\":\\\"Otimizar a cria\xE7\xE3o de imagens
        e gerenciar arquivos internos.\\\",\\\"O Qu\xEA Pesquisar (Teoria)\\\":[\\\"Instru\xE7\xF5es
        WORKDIR, COPY e ADD.\\\",\\\"Boas pr\xE1ticas: como manter imagens pequenas.\\\",\\\"Vari\xE1veis
        de ambiente com ENV.\\\"],\\\"M\xE3o na Massa (Pr\xE1tica)\\\":\\\"Criar um
        Dockerfile que copia um arquivo local para dentro da imagem e define o diret\xF3rio
        de trabalho.\\\",\\\"Verifica\xE7\xE3o de Aprendizado\\\":\\\"Qual a vantagem
        de usar o WORKDIR em vez de v\xE1rios comandos 'cd' seguidos?\\\"},{\\\"day\\\":10,\\\"title\\\":\\\"Persist\xEAncia
        de Dados (Volumes)\\\",\\\"Meta do Dia\\\":\\\"Entender como manter dados
        mesmo ap\xF3s a exclus\xE3o de um container.\\\",\\\"O Qu\xEA Pesquisar (Teoria)\\\":[\\\"Bind
        Mounts versus Docker Volumes oficiais.\\\",\\\"Ciclo de vida do dado versus
        ciclo de vida do container.\\\",\\\"O comando 'docker volume create/ls/inspect'.\\\"],\\\"M\xE3o
        na Massa (Pr\xE1tica)\\\":\\\"Montar um volume em um container de banco de
        dados e verificar que os dados persistem ap\xF3s deletar o container.\\\",\\\"Verifica\xE7\xE3o
        de Aprendizado\\\":\\\"Por que os arquivos criados dentro do container s\xE3o
        perdidos quando o container \xE9 removido sem volumes?\\\"},{\\\"day\\\":11,\\\"title\\\":\\\"Redes
        no Docker (Networking)\\\",\\\"Meta do Dia\\\":\\\"Compreender como containers
        se comunicam entre si.\\\",\\\"O Qu\xEA Pesquisar (Teoria)\\\":[\\\"Drivers
        de rede padr\xE3o: bridge, host, none.\\\",\\\"Comunica\xE7\xE3o por IP versus
        comunica\xE7\xE3o por Nome do Container.\\\",\\\"Isolamento de redes personalizadas.\\\"],\\\"M\xE3o
        na Massa (Pr\xE1tica)\\\":\\\"Criar uma rede bridge customizada e fazer dois
        containers 'pingarem' um ao outro usando seus nomes.\\\",\\\"Verifica\xE7\xE3o
        de Aprendizado\\\":\\\"Em qual driver de rede os containers compartilham a
        mesma stack de rede que o host?\\\"},{\\\"day\\\":12,\\\"title\\\":\\\"Orquestra\xE7\xE3o
        Simples: Docker Compose\\\",\\\"Meta do Dia\\\":\\\"Gerenciar m\xFAltiplos
        containers de forma declarativa em um \xFAnico arquivo.\\\",\\\"O Qu\xEA Pesquisar
        (Teoria)\\\":[\\\"O que \xE9 o Docker Compose e o arquivo docker-compose.yaml?\\\",\\\"Comandos
        'docker-compose up', 'down' e 'ps'.\\\",\\\"Defini\xE7\xE3o de services, networks
        e volumes no arquivo YAML.\\\"],\\\"M\xE3o na Massa (Pr\xE1tica)\\\":\\\"Escrever
        um docker-compose.yml para subir simultaneamente um servi\xE7o Web e um Banco
        de Dados.\\\",\\\"Verifica\xE7\xE3o de Aprendizado\\\":\\\"Qual comando do
        Compose voc\xEA usaria para encerrar e remover todos os recursos criados por
        ele?\\\"},{\\\"day\\\":13,\\\"title\\\":\\\"Trabalho Multi-servi\xE7o e Vari\xE1veis\\\",\\\"Meta
        do Dia\\\":\\\"Configurar aplica\xE7\xF5es complexas e depend\xEAncias no
        Compose.\\\",\\\"O Qu\xEA Pesquisar (Teoria)\\\":[\\\"A propriedade 'depends_on'
        no Compose.\\\",\\\"Uso de arquivos .env para configura\xE7\xF5es sens\xEDveis.\\\",\\\"Logs
        e monitoramento de stacks compostas.\\\"],\\\"M\xE3o na Massa (Pr\xE1tica)\\\":\\\"Adicionar
        uma vari\xE1vel de ambiente no docker-compose.yml e verificar se o container
        a reconheceu via 'printenv'.\\\",\\\"Verifica\xE7\xE3o de Aprendizado\\\":\\\"O
        par\xE2metro 'depends_on' garante que o banco de dados est\xE1 'pronto' ou
        apenas que o processo iniciou?\\\"},{\\\"day\\\":14,\\\"title\\\":\\\"Limpeza
        e Revis\xE3o Final\\\",\\\"Meta do Dia\\\":\\\"Aprender comandos de manuten\xE7\xE3o
        do sistema Docker e revis\xE3o geral.\\\",\\\"O Qu\xEA Pesquisar (Teoria)\\\":[\\\"Comandos
        de limpeza: 'docker system prune'.\\\",\\\"Recapitulando todos os comandos
        CLI aprendidos (run, stop, build, compose).\\\",\\\"Identifica\xE7\xE3o de
        imagens orf\xE3s (dangling images).\\\"],\\\"M\xE3o na Massa (Pr\xE1tica)\\\":\\\"Executar
        uma limpeza total no ambiente de testes e documentar um resumo dos comandos
        mais utilizados.\\\",\\\"Verifica\xE7\xE3o de Aprendizado\\\":\\\"Qual a fun\xE7\xE3o
        do 'docker system prune' e por que ele deve ser usado com cautela?\\\"}]\",\n
