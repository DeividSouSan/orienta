      string: "{\n  \"candidates\": [\n    {\n      \"content\": {\n        \"parts\":
        [\n          {\n            \"text\": \"[\\n    {\\n        \\\"day\\\": 1,\\n
        \       \\\"title\\\": \\\"Introdu\xE7\xE3o ao Docker\\\",\\n        \\\"Meta
        do Dia\\\": \\\"Compreender o que \xE9 Docker e sua import\xE2ncia no desenvolvimento
        de software.\\\",\\n        \\\"O Qu\xEA Pesquisar (Teoria)\\\": [\\n            \\\"O
        que \xE9 Docker?\\\",\\n            \\\"Para que serve o Docker?\\\",\\n            \\\"Principais
        benef\xEDcios do Docker.\\\"\\n        ],\\n        \\\"M\xE3o na Massa (Pr\xE1tica)\\\":
        \\\"Instalar o Docker Desktop em sua m\xE1quina.\\\",\\n        \\\"Verifica\xE7\xE3o
        de Aprendizado\\\": \\\"Quais problemas o Docker busca resolver?\\\"\\n    },\\n
        \   {\\n        \\\"day\\\": 2,\\n        \\\"title\\\": \\\"Containers vs
        M\xE1quinas Virtuais\\\",\\n        \\\"Meta do Dia\\\": \\\"Diferenciar containers
        Docker de m\xE1quinas virtuais e entender suas vantagens.\\\",\\n        \\\"O
        Qu\xEA Pesquisar (Teoria)\\\": [\\n            \\\"Diferen\xE7as entre Containers
        e M\xE1quinas Virtuais.\\\",\\n            \\\"Arquitetura do Docker (Docker
        Engine, Daemon, CLI).\\\",\\n            \\\"Vantagens do uso de containers.\\\"\\n
        \       ],\\n        \\\"M\xE3o na Massa (Pr\xE1tica)\\\": \\\"Escrever um
        par\xE1grafo comparando um container Docker com uma m\xE1quina virtual, focando
        em isolamento e uso de recursos.\\\",\\n        \\\"Verifica\xE7\xE3o de Aprendizado\\\":
        \\\"Qual a principal diferen\xE7a arquitetural entre um container e uma m\xE1quina
        virtual?\\\"\\n    },\\n    {\\n        \\\"day\\\": 3,\\n        \\\"title\\\":
        \\\"Imagens Docker\\\",\\n        \\\"Meta do Dia\\\": \\\"Entender o conceito
        de Imagens Docker e como elas s\xE3o constru\xEDdas.\\\",\\n        \\\"O
        Qu\xEA Pesquisar (Teoria)\\\": [\\n            \\\"O que s\xE3o Imagens Docker?\\\",\\n
        \           \\\"Como funcionam as camadas de imagem?\\\",\\n            \\\"Onde
        encontrar imagens prontas (Docker Hub).\\\"\\n        ],\\n        \\\"M\xE3o
        na Massa (Pr\xE1tica)\\\": \\\"Pesquisar por imagens populares no Docker Hub
        (ex: ubuntu, nginx, mysql) e ler suas descri\xE7\xF5es.\\\",\\n        \\\"Verifica\xE7\xE3o
        de Aprendizado\\\": \\\"Uma Imagem Docker \xE9 imut\xE1vel ou mut\xE1vel?
        Por qu\xEA?\\\"\\n    },\\n    {\\n        \\\"day\\\": 4,\\n        \\\"title\\\":
        \\\"Executando seu Primeiro Container\\\",\\n        \\\"Meta do Dia\\\":
        \\\"Executar um container a partir de uma imagem e interagir com ele.\\\",\\n
        \       \\\"O Qu\xEA Pesquisar (Teoria)\\\": [\\n            \\\"Comando `docker
        run`.\\\",\\n            \\\"Diferen\xE7a entre rodar um container em modo
        interativo (`-it`) e detached (`-d`).\\\",\\n            \\\"Gerenciamento
        de containers (listar, parar, iniciar, remover).\\\"\\n        ],\\n        \\\"M\xE3o
        na Massa (Pr\xE1tica)\\\": \\\"Executar um container `ubuntu` em modo interativo,
        instalar o `nginx` dentro dele e verificar se ele est\xE1 rodando. Depois,
        parar e remover o container.\\\",\\n        \\\"Verifica\xE7\xE3o de Aprendizado\\\":
        \\\"Qual a diferen\xE7a entre uma Imagem e um Container no Docker?\\\"\\n
        \   },\\n    {\\n        \\\"day\\\": 5,\\n        \\\"title\\\": \\\"Dockerfile:
        Criando Imagens Personalizadas\\\",\\n        \\\"Meta do Dia\\\": \\\"Aprender
        a criar seu pr\xF3prio Dockerfile para construir imagens.\\\",\\n        \\\"O
        Qu\xEA Pesquisar (Teoria)\\\": [\\n            \\\"O que \xE9 um Dockerfile?\\\",\\n
        \           \\\"Comandos b\xE1sicos de um Dockerfile (FROM, RUN, COPY, CMD,
        EXPOSE, etc.).\\\",\\n            \\\"Estrutura de um Dockerfile.\\\"\\n        ],\\n
        \       \\\"M\xE3o na Massa (Pr\xE1tica)\\\": \\\"Criar um Dockerfile simples
        para uma aplica\xE7\xE3o 'Hello, World!' em Python.\\\",\\n        \\\"Verifica\xE7\xE3o
        de Aprendizado\\\": \\\"Para que serve o comando `RUN` em um Dockerfile?\\\"\\n
        \   },\\n    {\\n        \\\"day\\\": 6,\\n        \\\"title\\\": \\\"Construindo
        e Gerenciando Imagens\\\",\\n        \\\"Meta do Dia\\\": \\\"Construir uma
        imagem a partir de um Dockerfile e gerenciar suas imagens locais.\\\",\\n
        \       \\\"O Qu\xEA Pesquisar (Teoria)\\\": [\\n            \\\"Comando `docker
        build`.\\\",\\n            \\\"Tags de imagem.\\\",\\n            \\\"Comando
        `docker images` e `docker rmi`.\\\"\\n        ],\\n        \\\"M\xE3o na Massa
        (Pr\xE1tica)\\\": \\\"Construir a imagem criada no dia anterior usando `docker
        build` e list\xE1-la com `docker images`.\\\",\\n        \\\"Verifica\xE7\xE3o
        de Aprendizado\\\": \\\"O que acontece se voc\xEA executar `docker build`
        novamente sem nenhuma altera\xE7\xE3o no Dockerfile?\\\"\\n    },\\n    {\\n
        \       \\\"day\\\": 7,\\n        \\\"title\\\": \\\"Navega\xE7\xE3o em Containers\\\",\\n
        \       \\\"Meta do Dia\\\": \\\"Aprender a entrar e sair de containers em
        execu\xE7\xE3o e a executar comandos dentro deles.\\\",\\n        \\\"O Qu\xEA
        Pesquisar (Teoria)\\\": [\\n            \\\"Comando `docker exec`.\\\",\\n
        \           \\\"Comando `docker attach` (e suas diferen\xE7as com `exec`).\\\",\\n
        \           \\\"Logar em um container.\\\"\\n        ],\\n        \\\"M\xE3o
        na Massa (Pr\xE1tica)\\\": \\\"Inicie um container `ubuntu` em modo detached
        e use `docker exec` para criar um arquivo dentro dele.\\\",\\n        \\\"Verifica\xE7\xE3o
        de Aprendizado\\\": \\\"Quando voc\xEA usaria `docker exec` e quando usaria
        `docker attach`?\\\"\\n    },\\n    {\\n        \\\"day\\\": 8,\\n        \\\"title\\\":
        \\\"Volume: Persist\xEAncia de Dados\\\",\\n        \\\"Meta do Dia\\\": \\\"Compreender
        como usar volumes para persistir dados fora do ciclo de vida de um container.\\\",\\n
        \       \\\"O Qu\xEA Pesquisar (Teoria)\\\": [\\n            \\\"O que s\xE3o
        Volumes Docker?\\\",\\n            \\\"Tipos de Volumes (Named Volumes, Bind
        Mounts).\\\",\\n            \\\"Vantagens da persist\xEAncia de dados com
        volumes.\\\"\\n        ],\\n        \\\"M\xE3o na Massa (Pr\xE1tica)\\\":
        \\\"Crie um container de banco de dados (ex: PostgreSQL) e use um volume para
        garantir que os dados persistam mesmo se o container for removido e recriado.\\\",\\n
