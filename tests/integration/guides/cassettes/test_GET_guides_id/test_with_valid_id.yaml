        no Compose\\\"\\n        ],\\n        \\\"M\xE3o na Massa (Pr\xE1tica)\\\":
        \\\"Refa\xE7a o `docker-compose.yml` do dia anterior adicionando redes customizadas,
        volumes para o banco de dados e definindo uma imagem para ser constru\xEDda
        localmente.\\\",\\n        \\\"Verifica\xE7\xE3o de Aprendizado\\\": \\\"Como
        voc\xEA especifica que um servi\xE7o deve iniciar somente ap\xF3s outro servi\xE7o
        estar pronto usando Docker Compose?\\\"\\n    },\\n    {\\n        \\\"day\\\":
        10,\\n        \\\"title\\\": \\\"Boas Pr\xE1ticas e Resolu\xE7\xE3o de Problemas
