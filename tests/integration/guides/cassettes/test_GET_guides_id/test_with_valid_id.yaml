        start`)\\\",\\n            \\\"Como parar um cont\xEAiner? (`docker stop`,
        `docker kill`)\\\"\\n        ],\\n        \\\"M\xE3o na Massa (Pr\xE1tica)\\\":
        \\\"Execute alguns cont\xEAineres (ex: nginx, ubuntu), pare-os e liste-os
        para verificar seu status.\\\",\\n        \\\"Verifica\xE7\xE3o de Aprendizado\\\":
        \\\"Quais comandos voc\xEA usaria para ver todos os cont\xEAineres, iniciar
        um cont\xEAiner parado e parar um cont\xEAiner em execu\xE7\xE3o?\\\"\\n    },\\n
        \   {\\n        \\\"day\\\": 3,\\n        \\\"title\\\": \\\"Imagens Docker:
        Criando e Gerenciando\\\",\\n        \\\"Meta do Dia\\\": \\\"Entender o conceito
        de imagens Docker e como gerenci\xE1-las.\\\",\\n        \\\"O Qu\xEA Pesquisar
        (Teoria)\\\": [\\n            \\\"O que \xE9 uma imagem Docker?\\\",\\n            \\\"Como
        listar imagens Docker? (`docker images`)\\\",\\n            \\\"Como baixar
        imagens de um registro (Docker Hub)? (`docker pull`)\\\",\\n            \\\"Como
        remover imagens? (`docker rmi`)\\\"\\n        ],\\n        \\\"M\xE3o na Massa
        (Pr\xE1tica)\\\": \\\"Baixe diferentes imagens do Docker Hub (ex: mysql, python),
        liste-as e remova uma delas.\\\",\\n        \\\"Verifica\xE7\xE3o de Aprendizado\\\":
        \\\"Qual a diferen\xE7a entre um cont\xEAiner e uma imagem Docker?\\\"\\n
        \   },\\n    {\\n        \\\"day\\\": 4,\\n        \\\"title\\\": \\\"Criando
        sua Primeira Imagem Docker: Dockerfile B\xE1sico\\\",\\n        \\\"Meta do
        Dia\\\": \\\"Aprender a criar uma imagem Docker personalizada a partir de
        um Dockerfile.\\\",\\n        \\\"O Qu\xEA Pesquisar (Teoria)\\\": [\\n            \\\"O
        que \xE9 um Dockerfile?\\\",\\n            \\\"Instru\xE7\xF5es b\xE1sicas
        do Dockerfile: `FROM`, `RUN`, `COPY`, `CMD`\\\",\\n            \\\"Como construir
        uma imagem a partir de um Dockerfile? (`docker build`)\\\"\\n        ],\\n
        \       \\\"M\xE3o na Massa (Pr\xE1tica)\\\": \\\"Crie um Dockerfile simples
        para uma aplica\xE7\xE3o Node.js b\xE1sica (ou Python) e construa a imagem.\\\",\\n
        \       \\\"Verifica\xE7\xE3o de Aprendizado\\\": \\\"Explique o prop\xF3sito
        do comando `RUN` dentro de um Dockerfile.\\\"\\n    },\\n    {\\n        \\\"day\\\":
        5,\\n        \\\"title\\\": \\\"Interagindo com Cont\xEAineres: Exec e Logs\\\",\\n
