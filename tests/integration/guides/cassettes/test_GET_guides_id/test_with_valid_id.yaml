        em um cont\xEAiner? (`-v` flag no `docker run`)\\\"\\n        ],\\n        \\\"M\xE3o
        na Massa (Pr\xE1tica)\\\": \\\"Inicie um cont\xEAiner de banco de dados (ex:
        PostgreSQL) com um volume, adicione dados e reinicie o cont\xEAiner para verificar
        se os dados persistem.\\\",\\n        \\\"Verifica\xE7\xE3o de Aprendizado\\\":
        \\\"Por que volumes s\xE3o essenciais ao trabalhar com bancos de dados em
