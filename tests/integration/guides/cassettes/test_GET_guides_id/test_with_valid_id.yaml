        na Massa (Pr\xE1tica)\\\": \\\"Instalar o Docker no seu sistema operacional
        e executar o primeiro cont\xEAiner (ex: hello-world).\\\",\\n        \\\"Verifica\xE7\xE3o
        de Aprendizado\\\": \\\"Descreva em suas pr\xF3prias palavras o que \xE9 um
        cont\xEAiner Docker e um benef\xEDcio chave de sua utiliza\xE7\xE3o.\\\"\\n
        \   },\\n    {\\n        \\\"day\\\": 2,\\n        \\\"title\\\": \\\"Primeiros
        Comandos do Docker: Gerenciando Cont\xEAineres\\\",\\n        \\\"Meta do
        Dia\\\": \\\"Aprender a iniciar, parar e gerenciar o ciclo de vida b\xE1sico
