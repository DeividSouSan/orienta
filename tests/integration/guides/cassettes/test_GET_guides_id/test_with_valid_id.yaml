        Qu\xEA Pesquisar (Teoria)\\\": [\\n            \\\"O que \xE9 Docker Compose?\\\",\\n
        \           \\\"Estrutura de um arquivo `docker-compose.yml`\\\",\\n            \\\"Comandos
        b\xE1sicos: `docker-compose up`, `docker-compose down`, `docker-compose ps`\\\"\\n
        \       ],\\n        \\\"M\xE3o na Massa (Pr\xE1tica)\\\": \\\"Crie um arquivo
        `docker-compose.yml` para uma aplica\xE7\xE3o web simples com um frontend
        e um backend (ambos como servi\xE7os) e inicie a aplica\xE7\xE3o.\\\",\\n
        \       \\\"Verifica\xE7\xE3o de Aprendizado\\\": \\\"Quais problemas o Docker
