        [\n          {\n            \"text\": \"[\\n  {\\n    \\\"day\\\": 1,\\n    \\\"title\\\":
        \\\"Fundamentos de Conteineriza\xE7\xE3o\\\",\\n    \\\"Meta do Dia\\\": \\\"Entender
        a diferen\xE7a fundamental entre M\xE1quinas Virtuais e Cont\xEAineres.\\\",\\n
        \   \\\"O Qu\xEA Pesquisar (Teoria)\\\": [\\n      \\\"O que \xE9 isolamento
        de processos no n\xEDvel do SO?\\\",\\n      \\\"Diferen\xE7a de arquitetura:
        VM (Hypervisor) vs Docker (Container Engine).\\\",\\n      \\\"Vantagens de
        portabilidade e escalabilidade com Docker.\\\"\\n    ],\\n    \\\"M\xE3o na
        Massa (Pr\xE1tica)\\\": \\\"Desenhar ou diagramar comparativamente a stack
        de camadas de uma VM e de um cont\xEAiner Docker.\\\",\\n    \\\"Verifica\xE7\xE3o
        de Aprendizado\\\": \\\"Qual o componente compartilhado entre os cont\xEAineres
        e o host que n\xE3o \xE9 compartilhado em uma VM?\\\",\\n    \\\"completed\\\":
        false\\n  },\\n  {\\n    \\\"day\\\": 2,\\n    \\\"title\\\": \\\"Arquitetura
        e Ecossistema Docker\\\",\\n    \\\"Meta do Dia\\\": \\\"Compreender como
        o Docker funciona internamente atrav\xE9s de sua arquitetura cliente-servidor.\\\",\\n
        \   \\\"O Qu\xEA Pesquisar (Teoria)\\\": [\\n      \\\"O que \xE9 o Docker
        Daemon (dockerd)?\\\",\\n      \\\"Qual o papel do Docker Client (CLI)?\\\",\\n
        \     \\\"O que \xE9 o Docker Hub e o conceito de Registro.\\\"\\n    ],\\n
        \   \\\"M\xE3o na Massa (Pr\xE1tica)\\\": \\\"Pesquisar e instalar o Docker
        Desktop (ou Engine) em seu sistema operacional e verificar a vers\xE3o instalada
        no terminal.\\\",\\n    \\\"Verifica\xE7\xE3o de Aprendizado\\\": \\\"Como
        o CLI do Docker se comunica com o Daemon?\\\",\\n    \\\"completed\\\": false\\n
        \ },\\n  {\\n    \\\"day\\\": 3,\\n    \\\"title\\\": \\\"O Ciclo 'Hello World'
        e Imagens\\\",\\n    \\\"Meta do Dia\\\": \\\"Executar o primeiro cont\xEAiner
        e entender a rela\xE7\xE3o entre Imagem e Inst\xE2ncia.\\\",\\n    \\\"O Qu\xEA
        Pesquisar (Teoria)\\\": [\\n      \\\"O que \xE9 uma Docker Image e como ela
        \xE9 formada por camadas?\\\",\\n      \\\"O comando docker pull: como buscar
        imagens?\\\",\\n      \\\"Diferen\xE7a entre Imagem (template) e Cont\xEAiner
        (processo running).\\\"\\n    ],\\n    \\\"M\xE3o na Massa (Pr\xE1tica)\\\":
        \\\"Executar o comando 'docker run hello-world' e analisar cada etapa da sa\xEDda
        no terminal.\\\",\\n    \\\"Verifica\xE7\xE3o de Aprendizado\\\": \\\"O que
        acontece localmente se o Docker n\xE3o encontra a imagem solicitada no seu
        computador?\\\",\\n    \\\"completed\\\": false\\n  },\\n  {\\n    \\\"day\\\":
        4,\\n    \\\"title\\\": \\\"Gerenciamento B\xE1sico de Cont\xEAineres\\\",\\n
        \   \\\"Meta do Dia\\\": \\\"Aprender os comandos essenciais para iniciar
        e listar processos Docker.\\\",\\n    \\\"O Qu\xEA Pesquisar (Teoria)\\\":
        [\\n      \\\"Funcionamento do comando docker run.\\\",\\n      \\\"Como listar
        cont\xEAineres ativos (docker ps) e inativos (docker ps -a).\\\",\\n      \\\"Atalhos
        de execu\xE7\xE3o: nomes customizados com o par\xE2metro --name.\\\"\\n    ],\\n
        \   \\\"M\xE3o na Massa (Pr\xE1tica)\\\": \\\"Subir tr\xEAs cont\xEAineres
        'ubuntu' diferentes, atribuir nomes personalizados a cada um e list\xE1-los.\\\",\\n
        \   \\\"Verifica\xE7\xE3o de Aprendizado\\\": \\\"Qual o comando para listar
        cont\xEAineres que j\xE1 foram encerrados?\\\",\\n    \\\"completed\\\": false\\n
        \ },\\n  {\\n    \\\"day\\\": 5,\\n    \\\"title\\\": \\\"Cont\xEAineres Interativos
        e Terminais\\\",\\n    \\\"Meta do Dia\\\": \\\"Aprender a interagir com o
        interior de um cont\xEAiner em execu\xE7\xE3o.\\\",\\n    \\\"O Qu\xEA Pesquisar
        (Teoria)\\\": [\\n      \\\"Significado das flags -i (interativo) e -t (tty).\\\",\\n
        \     \\\"O comando docker exec: como rodar comandos em cont\xEAineres j\xE1
        existentes?\\\",\\n      \\\"Diferen\xE7a entre o terminal do host e o terminal
        do cont\xEAiner.\\\"\\n    ],\\n    \\\"M\xE3o na Massa (Pr\xE1tica)\\\":
        \\\"Rodar um cont\xEAiner 'ubuntu' no modo interativo, criar um arquivo 'teste.txt'
        dentro dele e sair do cont\xEAiner.\\\",\\n    \\\"Verifica\xE7\xE3o de Aprendizado\\\":
        \\\"Qual flag permite que voc\xEA digite comandos dentro do cont\xEAiner em
        tempo real?\\\",\\n    \\\"completed\\\": false\\n  },\\n  {\\n    \\\"day\\\":
        6,\\n    \\\"title\\\": \\\"Limpeza e Ciclo de Vida\\\",\\n    \\\"Meta do
        Dia\\\": \\\"Dominar a remo\xE7\xE3o de recursos para evitar desperd\xEDcio
        de mem\xF3ria e disco.\\\",\\n    \\\"O Qu\xEA Pesquisar (Teoria)\\\": [\\n
        \     \\\"Comandos docker stop, docker start e docker rm.\\\",\\n      \\\"Como
        remover imagens locais com docker rmi.\\\",\\n      \\\"O comando docker system
        prune para limpeza em massa.\\\"\\n    ],\\n    \\\"M\xE3o na Massa (Pr\xE1tica)\\\":
        \\\"Parar todos os cont\xEAineres em execu\xE7\xE3o, remov\xEA-los e depois
        apagar as imagens baixadas anteriormente.\\\",\\n    \\\"Verifica\xE7\xE3o
        de Aprendizado\\\": \\\"\xC9 poss\xEDvel remover um cont\xEAiner que ainda
        est\xE1 em execu\xE7\xE3o sem par\xE1-lo antes?\\\",\\n    \\\"completed\\\":
        false\\n  },\\n  {\\n    \\\"day\\\": 7,\\n    \\\"title\\\": \\\"Inspe\xE7\xE3o
        e Logs\\\",\\n    \\\"Meta do Dia\\\": \\\"Saber extrair informa\xE7\xF5es
        e debugar cont\xEAineres atrav\xE9s de logs.\\\",\\n    \\\"O Qu\xEA Pesquisar
        (Teoria)\\\": [\\n      \\\"O comando docker logs e o par\xE2metro -f (follow).\\\",\\n
        \     \\\"Como ler o JSON de configura\xE7\xE3o de um objeto com docker inspect?\\\",\\n
        \     \\\"Comando docker top para monitorar processos.\\\"\\n    ],\\n    \\\"M\xE3o
        na Massa (Pr\xE1tica)\\\": \\\"Rodar um cont\xEAiner 'nginx' em background
        e visualizar os logs de acesso em tempo real enquanto tenta acess\xE1-lo (mesmo
        que sem sucesso externo ainda).\\\",\\n    \\\"Verifica\xE7\xE3o de Aprendizado\\\":
        \\\"Para que serve o comando docker inspect?\\\",\\n    \\\"completed\\\":
        false\\n  },\\n  {\\n    \\\"day\\\": 8,\\n    \\\"title\\\": \\\"Cria\xE7\xE3o
        de Imagens: O Dockerfile (B\xE1sico)\\\",\\n    \\\"Meta do Dia\\\": \\\"Compreender
        como automatizar a cria\xE7\xE3o de imagens personalizadas.\\\",\\n    \\\"O
        Qu\xEA Pesquisar (Teoria)\\\": [\\n      \\\"O que \xE9 um Dockerfile?\\\",\\n
        \     \\\"Instru\xE7\xF5es b\xE1sicas: FROM, RUN, CMD.\\\",\\n      \\\"Processo
        de Build: Como transformar um arquivo em imagem?\\\"\\n    ],\\n    \\\"M\xE3o
        na Massa (Pr\xE1tica)\\\": \\\"Criar um Dockerfile que parta da imagem 'alpine'
        e execute um comando de instala\xE7\xE3o (ex: apk add curl).\\\",\\n    \\\"Verifica\xE7\xE3o
        de Aprendizado\\\": \\\"Qual instru\xE7\xE3o define a imagem base no in\xEDcio
        do Dockerfile?\\\",\\n    \\\"completed\\\": false\\n  },\\n  {\\n    \\\"day\\\":
        9,\\n    \\\"title\\\": \\\"Aprofundamento em Dockerfile\\\",\\n    \\\"Meta
        do Dia\\\": \\\"Aprender a estruturar melhor as imagens e gerenciar diret\xF3rios
        internos.\\\",\\n    \\\"O Qu\xEA Pesquisar (Teoria)\\\": [\\n      \\\"As
        instru\xE7\xF5es WORKDIR e COPY.\\\",\\n      \\\"Diferen\xE7a t\xE9cnica
        entre CMD e ENTRYPOINT.\\\",\\n      \\\"Conceito de Build Context.\\\"\\n
        \   ],\\n    \\\"M\xE3o na Massa (Pr\xE1tica)\\\": \\\"Criar um arquivo 'app.txt'
        local e construir um Dockerfile que copie esse arquivo para dentro da imagem
        no diret\xF3rio '/home'.\\\",\\n    \\\"Verifica\xE7\xE3o de Aprendizado\\\":
        \\\"O que acontece se eu usar RUN para criar um arquivo vs us\xE1-lo na instru\xE7\xE3o
        CMD?\\\",\\n    \\\"completed\\\": false\\n  },\\n  {\\n    \\\"day\\\": 10,\\n
        \   \\\"title\\\": \\\"Persist\xEAncia de Dados com Volumes\\\",\\n    \\\"Meta
        do Dia\\\": \\\"Resolver o problema de efemeridade dos dados em cont\xEAineres.\\\",\\n
        \   \\\"O Qu\xEA Pesquisar (Teoria)\\\": [\\n      \\\"Por que os dados somem
        ao deletar um cont\xEAiner?\\\",\\n      \\\"Docker Volumes vs Bind Mounts:
        qual a diferen\xE7a?\\\",\\n      \\\"Sintaxe da flag -v ou --mount.\\\"\\n
        \   ],\\n    \\\"M\xE3o na Massa (Pr\xE1tica)\\\": \\\"Criar um volume nomeado,
        mape\xE1-lo para um cont\xEAiner, criar um arquivo dentro do volume, apagar
        o cont\xEAiner e verificar se o arquivo sobreviveu em um novo cont\xEAiner.\\\",\\n
        \   \\\"Verifica\xE7\xE3o de Aprendizado\\\": \\\"Qual o comando para listar
        todos os volumes criados no seu sistema?\\\",\\n    \\\"completed\\\": false\\n
        \ },\\n  {\\n    \\\"day\\\": 11,\\n    \\\"title\\\": \\\"Redes e Mapeamento
        de Portas\\\",\\n    \\\"Meta do Dia\\\": \\\"Aprender a expor servi\xE7os
        de cont\xEAineres para o mundo externo.\\\",\\n    \\\"O Qu\xEA Pesquisar
        (Teoria)\\\": [\\n      \\\"Exposi\xE7\xE3o de portas: flag -p (host_port:container_port).\\\",\\n
        \     \\\"Redes Bridge padr\xE3o e redes User-defined.\\\",\\n      \\\"Comunica\xE7\xE3o
        entre cont\xEAineres pelo nome do servi\xE7o.\\\"\\n    ],\\n    \\\"M\xE3o
        na Massa (Pr\xE1tica)\\\": \\\"Rodar um servidor 'nginx' mapeando a porta
        8080 do host para a porta 80 do cont\xEAiner e acessar 'localhost:8080' no
        navegador.\\\",\\n    \\\"Verifica\xE7\xE3o de Aprendizado\\\": \\\"Se eu
        rodar 'docker run -p 5000:3000', em qual porta do meu computador eu devo acessar
        o servi\xE7o?\\\",\\n    \\\"completed\\\": false\\n  },\\n  {\\n    \\\"day\\\":
