      (Ex: \"asdfasdf\" ou \"jkhk 123!!\").\n\nREGRAS DE SA\u00cdDA:\n\n1.  **is_valid**:
      Este campo DEVE ser `true` se, e somente se, `is_relevant` for `true` E `is_bad_language`
